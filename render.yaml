services:
  - type: web
    name: lps-junagadh
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: lps-db
          property: connectionString
      - key: RUN_SEEDER
        value: "true"

databases:
  - name: lps-db
    plan: free
    region: singapore
